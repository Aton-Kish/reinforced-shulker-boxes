plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
	id "com.modrinth.minotaur" version "2.+"
	id 'checkstyle'
	id "com.diffplug.spotless" version "8.2.1"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Reinforced Storage
	maven {
		url = "https://raw.githubusercontent.com/Aton-Kish/mcmod/maven"
	}

	// ModMenu (Reinforced Core deps)
	maven {
		url = "https://maven.terraformersmc.com/releases/"
	}

	// Cloth Config (Reinforced Core deps)
	maven {
		url = "https://maven.shedaniel.me/"
	}

	// Shulker Box Tooltip
	maven {
		url = "https://maven.misterpemodder.com/libs-release"
	}

	// // Quick Shulker
	// maven {
	// 	url = "https://maven.kyrptonaught.dev"
	// }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"reinfshulker" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		serverTest {
			server()
			ideConfigGenerated true
			name "Minecraft Server Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/gametest/junit.xml"
			vmArg "-Datonkish.reinfshulker.gametest"
			runDir "build/gametest"
		}

		clientTest {
			client()
			ideConfigGenerated true
			name "Minecraft Client Test"
			vmArg "-Datonkish.reinfshulker.gametest"
			runDir "build/gametest"
		}
	}

	accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
}

sourceSets {
	main {
		java {
			exclude "atonkish/reinfshulker/gametest/**"
			exclude "atonkish/reinfshulker/integration/shulkerboxtooltip/**"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly files(
		".gradle/loom-cache/remapped_mods/remapped/net/fabricmc/fabric-api/fabric-item-group-api-v1-4abd26ae-common/4.2.36+4fc5413f3e/fabric-item-group-api-v1-4abd26ae-common-4.2.36+4fc5413f3e.jar"
	)
	clientCompileOnly files(
		".gradle/loom-cache/remapped_mods/remapped/net/fabricmc/fabric-api/fabric-rendering-v1-4abd26ae-client/16.2.9+7edacff13e/fabric-rendering-v1-4abd26ae-client-16.2.9+7edacff13e.jar"
	)

	// Reinforced Core
	implementation files(
		".gradle/loom-cache/remapped_mods/remapped/atonkish/reinfcore/reinforced-core-4abd26ae-common/${project.reinforced_core_version}/reinforced-core-4abd26ae-common-${project.reinforced_core_version}.jar"
	)
	clientImplementation files(
		".gradle/loom-cache/remapped_mods/remapped/atonkish/reinfcore/reinforced-core-4abd26ae-client/${project.reinforced_core_version}/reinforced-core-4abd26ae-client-${project.reinforced_core_version}.jar"
	)
	// Reinforced Chests
	compileOnly files(
		".gradle/loom-cache/remapped_mods/remapped/atonkish/reinfchest/reinforced-chests-4abd26ae-common/${project.reinforced_chests_version}/reinforced-chests-4abd26ae-common-${project.reinforced_chests_version}.jar"
	)

	// Shulker Box Tooltip
	compileOnly("com.misterpemodder:shulkerboxtooltip-fabric:${project.shulker_box_tooltip_version}") {
		transitive = false
	}

	// // Quick Shulker
	// modImplementation "net.kyrptonaught:quickshulker:${project.quick_shulker_version}"
	// // Quick Shulker deps
	// modImplementation "net.kyrptonaught:shulkerutils:${project.shulkerutils_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
	from(zipTree(".gradle/loom-cache/remapped_mods/remapped/atonkish/reinfcore/reinforced-core-4abd26ae-common/${project.reinforced_core_version}/reinforced-core-4abd26ae-common-${project.reinforced_core_version}.jar")) {
		exclude "fabric.mod.json", "META-INF/**", "LICENSE*", "NOTICE*"
	}
	from(zipTree(".gradle/loom-cache/remapped_mods/remapped/atonkish/reinfcore/reinforced-core-4abd26ae-client/${project.reinforced_core_version}/reinforced-core-4abd26ae-client-${project.reinforced_core_version}.jar")) {
		exclude "fabric.mod.json", "META-INF/**", "LICENSE*", "NOTICE*"
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
		maven {
			url = "file://${buildDir}/maven"
		}
	}
}

checkstyle {
	toolVersion = "13.0.0"
	configFile = file("${rootProject.projectDir}/checkstyle.xml")

	configProperties = [
		'org.checkstyle.google.severity': 'error'
	]
}

spotless {
	format 'misc', {
		target '*.gradle', 'gradle.properties'

		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}

	java {
		googleJavaFormat()
		importOrder(
			'java',
			'javax',
			'org.slf4j',
			'com.mojang',
			'net.minecraft',
			'net.fabricmc',
			'org.spongepowered',
			'',
			'atonkish'
		)
		removeUnusedImports()
		formatAnnotations()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

task curseforge(type: Exec) {
	environment "CURSEFORGE_API_TOKEN", project.findProperty("curseforge_token") ?: "Missing token"
	commandLine "sh", "-c", """
		set -eux

		# install
		MCMOD_RELEASER_VERSION="0.1.1"
		curl -sL https://github.com/Aton-Kish/mcmod-releaser/releases/download/v\${MCMOD_RELEASER_VERSION}/mcmod-releaser_\${MCMOD_RELEASER_VERSION}_linux_amd64.tar.gz | tar xzf - mcmod-releaser
		./mcmod-releaser --version

		# release
		./mcmod-releaser curseforge \
			--file "build/libs/${project.archives_base_name}-${project.version}.jar" \
			--project-id "${project.curseforge_id}" \
			--release-type "beta" \
			--version "${project.version}" \
			--name "Reinforced Shulker Boxes v${project.version}" \
			--changelog "[v${project.version}](https://github.com/Aton-Kish/reinforced-shulker-boxes/releases/tag/v${java.net.URLEncoder.encode(project.version, "UTF-8")})" \
			--environments "Client,Server" \
			--loaders "Fabric" \
			--java-versions "Java 21" \
			--game-versions "1.21.11" \
			--dependencies "fabric-api=required,cloth-config=embedded,modmenu=optional,shulkerboxtooltip=optional,reinforced-chests=optional"
	"""
}

modrinth {
	token = project.findProperty("modrinth_token") ?: "Missing token"

	projectId = project.modrinth_id

	uploadFile = jar
	versionNumber = project.version
	versionName = "Reinforced Shulker Boxes v${project.version}"
	versionType = "beta"
	changelog = "[v${project.version}](https://github.com/Aton-Kish/reinforced-shulker-boxes/releases/tag/v" + java.net.URLEncoder.encode(project.version, "UTF-8") + ")"

	gameVersions = ["26.2"]
	loaders = ["fabric"]

	dependencies {
		required.project "fabric-api"
		embedded.project "cloth-config"
		optional.project "modmenu"
		optional.project "shulkerboxtooltip"
		// optional.project "quickshulker"
		optional.project "reinforced-chests"
	}
}
